app = "bible-study-backend"
primary_region = "iad"

[build]

[env]
  PORT = "3001"
  DATABASE_URL = "file:/data/prod.db"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "sqlite_data"
  destination = "/data"
